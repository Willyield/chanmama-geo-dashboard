<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="./favicon.png">
  <title>玛卡星球 GEO 采样仪表盘</title>
  <style>
    :root{--ink:#172126;--muted:#657278;--line:#dce2e4;--surface:#fff;--wash:#f4f6f6;--accent:#d74832;--blue:#2563a6;--amber:#a86100;--ok:#18794e;--danger:#b42318;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--wash)}
    *{box-sizing:border-box}body{margin:0;min-width:320px}button,select,input{font:inherit}.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:9;background:#fff;padding:8px;border:2px solid var(--accent)}
    header{background:#172126;color:#fff;border-bottom:5px solid var(--accent)}.head{max-width:1440px;margin:auto;padding:22px 28px 20px}.eyebrow{margin:0 0 5px;color:#a7c7cc;font-size:12px;font-weight:700}.head h1{margin:0;font-size:clamp(24px,3vw,38px);line-height:1.15;letter-spacing:0}.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.head p{margin:8px 0 0;color:#c8d2d5;max-width:820px;font-size:14px}.status{font-size:13px;border:1px solid #627074;padding:7px 10px;border-radius:4px;white-space:nowrap}.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;font-size:12px;color:#c8d2d5}.meta b{color:#fff}
    main{max-width:1440px;margin:auto;padding:20px 28px 48px}.tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:12px}.tabs button{min-height:44px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font-weight:700;padding:10px 15px;cursor:pointer;white-space:nowrap}.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}.tabs button:focus-visible{outline:3px solid #8ab4d6;outline-offset:-3px}.view-context{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 20px;padding:9px 0;border-bottom:1px solid var(--line)}.view-context b{font-size:14px}.view-context span{color:var(--muted);font-size:12px;text-align:right}
    .section{margin:0 0 26px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:10px}.section h2{margin:0;font-size:18px;letter-spacing:0}.section-head p{margin:0;color:var(--muted);font-size:12px;text-align:right}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface)}.kpi{min-width:0;padding:16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.kpi small{display:block;color:var(--muted);font-weight:700;min-height:34px}.kpi strong{display:block;margin:7px 0 5px;font-size:25px;line-height:1;overflow-wrap:anywhere}.kpi span{display:block;font-size:12px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}.kpi[data-status="UNRESOLVED"] strong,.kpi[data-status="NOT_APPLICABLE"] strong{font-size:16px;color:var(--muted)}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}.panel h3{font-size:14px;margin:0 0 13px}.bar{display:grid;grid-template-columns:minmax(90px,160px) 1fr 64px;gap:10px;align-items:center;margin:10px 0;font-size:12px}.track{height:8px;background:#e8edef;border-radius:2px;overflow:hidden}.fill{height:100%;background:var(--blue)}.bar b{text-align:right}.status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}.status-grid div{background:#fff;padding:13px}.status-grid span{display:block;color:var(--muted);font-size:12px}.status-grid b{display:block;margin-top:5px;font-size:18px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.empty{color:var(--muted);padding:28px;text-align:center}
    .callout{border-left:4px solid var(--accent);padding:11px 14px;background:#fff;margin-bottom:20px;font-size:13px}.callout b{display:block;margin-bottom:3px}.hash{font-family:ui-monospace,Consolas,monospace;overflow-wrap:anywhere}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:50%;background:var(--blue)}.dot.amber{background:var(--amber)}.dot.red{background:var(--danger)}
    @media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.status-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.head-row{align-items:flex-start;flex-direction:column}.status{white-space:normal}}
    @media(max-width:520px){.head,main{padding-left:16px;padding-right:16px}.kpis{grid-template-columns:1fr 1fr}.kpi{padding:13px}.kpi strong{font-size:21px}.section-head,.view-context{align-items:flex-start;flex-direction:column}.section-head p,.view-context span{text-align:left}.status-grid{grid-template-columns:1fr}.bar{grid-template-columns:minmax(86px,120px) 1fr 44px}}
  </style>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <header><div class="head"><div class="head-row"><div><p class="eyebrow">MAKAPLANET · AIDSO FAST_WEB</p><h1>玛卡星球 GEO 采样仪表盘</h1><p>D1 保留样本与当前 D2 的累计总览、A-H 问题组及数据完整性。</p></div><span class="status" data-status>读取中</span></div><div class="meta"><span>快照 <b data-snapshot>--</b></span><span>计划槽位 <b data-planned>--</b></span><span>有效回答 <b data-valid>--</b></span><span>数据哈希 <b class="hash" data-hash>--</b></span></div></div></header>
  <main id="main"><div class="callout" data-callout><b>数据边界</b><span>正在读取冻结数据。</span></div><div class="tabs" role="tablist" aria-label="问题组"><button id="tab-total" role="tab" aria-controls="group-panel" aria-selected="true" tabindex="0" data-group="total">总览</button><button id="tab-A" role="tab" aria-controls="group-panel" aria-selected="false" tabindex="-1" data-group="A">A 组</button><button id="tab-B" role="tab" aria-controls="group-panel" aria-selected="false" tabindex="-1" data-group="B">B 组</button><button id="tab-C" role="tab" aria-controls="group-panel" aria-selected="false" tabindex="-1" data-group="C">C 组</button><button id="tab-D" role="tab" aria-controls="group-panel" aria-selected="false" tabindex="-1" data-group="D">D 组</button><button id="tab-E" role="tab" aria-controls="group-panel" aria-selected="false" tabindex="-1" data-group="E">E 组</button><button id="tab-F" role="tab" aria-controls="group-panel" aria-selected="false" tabindex="-1" data-group="F">F 组</button><button id="tab-G" role="tab" aria-controls="group-panel" aria-selected="false" tabindex="-1" data-group="G">G 组</button><button id="tab-H" role="tab" aria-controls="group-panel" aria-selected="false" tabindex="-1" data-group="H">H 组</button></div><div id="group-panel" role="tabpanel" aria-labelledby="tab-total" tabindex="0" data-view></div></main>
  <script>
    const VIEW="sampling";
    const pct=value=>value==null?'数据不足':Number(value).toFixed(2).replace(/\.00$/,'')+'%';
    const number=value=>Number(value||0).toLocaleString('zh-CN');
    const metric=(slice,id)=>slice.metrics?.[id]||{};
    const card=(label,value,note,status='READY')=>'<div class="kpi" data-status="'+status+'"><small>'+label+'</small><strong>'+value+'</strong><span>'+note+'</span></div>';
    const bars=(rows,labelKey='group',valueKey='percentage')=>rows.length?rows.map(row=>'<div class="bar"><span>'+row[labelKey]+'</span><div class="track"><div class="fill" style="width:'+Math.max(0,Math.min(100,Number(row[valueKey]||0)))+'%"></div></div><b>'+pct(row[valueKey])+'</b></div>').join(''):'<div class="empty">暂无可比较数据</div>';
    function sampling(slice,report){
      const observationLabel=report.observationStage==='FINAL_FOUR_OBSERVATIONS'?'四次观测终态':report.observationStage==='MIXED_4_AND_2_OBSERVATIONS'?'A-F 四次 / G-H 两次':'两次观测临时结果';
      const cards=[
        card('完成率',pct(slice.completion.percentage),slice.completion.numerator+' / '+slice.completion.denominator),
        card('品牌提及率',pct(metric(slice,'brand_mention_rate').percentage),metric(slice,'brand_mention_rate').numerator+' / '+metric(slice,'brand_mention_rate').denominator,metric(slice,'brand_mention_rate').status),
        card('首推率',pct(metric(slice,'top1_rate').percentage),metric(slice,'top1_rate').numerator+' / '+metric(slice,'top1_rate').denominator,metric(slice,'top1_rate').status),
        card('前三推荐率',pct(metric(slice,'top3_rate').percentage),metric(slice,'top3_rate').numerator+' / '+metric(slice,'top3_rate').denominator,metric(slice,'top3_rate').status),
        card('平均推荐排名',metric(slice,'average_rank').value==null?'数据不足':metric(slice,'average_rank').value,metric(slice,'average_rank').denominator+' 条命中回答',metric(slice,'average_rank').status),
        card('优势表达率',pct(metric(slice,'advantage_expression_rate').percentage),metric(slice,'advantage_expression_rate').numerator+' / '+metric(slice,'advantage_expression_rate').denominator,metric(slice,'advantage_expression_rate').status),
        card('商品卡出现率',pct(metric(slice,'product_card_rate').percentage),metric(slice,'product_card_rate').numerator+' / '+metric(slice,'product_card_rate').denominator,metric(slice,'product_card_rate').status),
        card('竞品品牌-回答命中',number(slice.competitorMentions.total),'统计对象：回答正文。按每个已登记竞品分别统计后求和；同一回答提到多个竞品会重复计数。'),
        card('竞品回答覆盖率',pct(slice.competitorMentions.sampleCoverage.percentage),'分子：至少提到 1 个已登记竞品的回答；分母：有效回答。每条回答最多计 1 次。'),
        card('回答引用覆盖率',pct(slice.citation.coverage.percentage),'分子：引用列表含至少 1 个规范化 URL 的回答；分母：引用状态可判定回答。不代表品牌或官网出现。'),
        card('玛卡官网引用覆盖率',pct(slice.citation.officialSourceCoverage.percentage),'分子：引用列表含 makaplanet.com 首页、内页或子域的唯一回答；分母：引用状态可判定回答。'),
        card('有效回答',number(slice.valid),slice.unknown+' 个 unknown'),
        card('结论阶段',observationLabel,report.observationStage==='FINAL_FOUR_OBSERVATIONS'?'不足四次标记数据不足':'G-H 不应用四次门槛')
      ];
      const rounds=Object.entries(report.roundMetrics).map(([group,item])=>({group,percentage:item.metrics.brand_mention_rate.percentage||0}));
      const days=Object.entries(report.dailyMetrics).map(([group,item])=>({group,percentage:item.metrics.brand_mention_rate.percentage||0}));
      const group=slice.groupId||'total';
      const special=group==='G'?'<section class="section"><div class="section-head"><h2>品牌优势差异明细</h2><p>仅 G 组展示</p></div><div class="panel">'+number(slice.advantageDifferenceDetails?.length)+' 条可审计回答明细</div></section>':group==='H'?'<section class="section"><div class="section-head"><h2>品牌事实正确率</h2><p>仅 H 组展示，unknown 不进入分母</p></div><div class="kpis">'+card('结果正确率',pct(metric(slice,'result_correctness_rate').percentage),metric(slice,'result_correctness_rate').numerator+' / '+metric(slice,'result_correctness_rate').denominator,metric(slice,'result_correctness_rate').status)+card('内容正确率',pct(metric(slice,'content_correctness_rate').percentage),metric(slice,'content_correctness_rate').numerator+' / '+metric(slice,'content_correctness_rate').denominator,metric(slice,'content_correctness_rate').status)+'</div></section>':'';
      return '<section class="section"><div class="section-head"><h2>关键指标</h2><p>所有比例保留分子、分母和 unknown</p></div><div class="kpis">'+cards.join('')+'</div></section>'+special+'<section class="section"><div class="section-head"><h2>轮次与日期变化</h2><p>柱形长度表示品牌提及率</p></div><div class="split"><div class="panel"><h3>按轮次</h3>'+bars(rounds)+'</div><div class="panel"><h3>按日期</h3>'+bars(days)+'</div></div></section><section class="section"><div class="section-head"><h2>问题状态与竞品</h2><p>候选词表冻结，新品牌不进入当轮计算</p></div><div class="split"><div class="panel"><h3>状态分布</h3><div class="status-grid">'+Object.entries(slice.questionStatus).map(([key,value])=>'<div><span>'+key+'</span><b>'+number(value)+'</b></div>').join('')+'</div></div><div class="panel"><h3>竞品提及份额</h3>'+bars(slice.competitorMentions.brands,'name','share')+'</div></div></section>';
    }
    function citation(slice){
      const c=slice.citation;const cards=[
        card('计划槽位',number(slice.planned),'当前总览或问题组'),card('有效回答',number(slice.valid),slice.unknown+' 个 unknown'),
        card('回答引用覆盖率',pct(c.coverage.percentage),'分子：引用列表含至少 1 个规范化 URL 的回答；分母：引用状态可判定回答。不代表品牌或官网出现。'),card('商品卡出现率',pct(slice.productCards.percentage),slice.productCards.numerator+' / '+slice.productCards.denominator),card('原始引用数',number(c.rawCitationCount),'统计引用列表的原始 URL 行数；商品卡不计入引用。'),
        card('样本内规范化去重',number(c.normalizedCitationCount),c.duplicateCount+' 条重复'),card('全局唯一 URL',number(c.globallyUniqueUrlCount),'跨样本去重'),
        card('域名数',number(c.domainCount),'规范化主机名'),card('每样本均值',c.perSample.mean,'仅引用状态可判定样本'),
        card('每样本中位数',c.perSample.median,'P50'),card('每样本 P90',c.perSample.p90,'nearest-rank'),
        card('重复占比',pct(c.duplicateShare),'分子：样本内重复 URL 行；分母：原始引用行。当前为 '+c.duplicateCount+' / '+c.rawCitationCount+'。'),card('玛卡官网引用覆盖率',pct(c.officialSourceCoverage.percentage),'分子：引用列表含 makaplanet.com 首页、内页或子域的唯一回答；分母：引用状态可判定回答。'),
        card('主站首页引用行',number(c.officialLayers.homepage),'样本内 URL 去重后的官网首页引用；统计的是引用行，不是回答数。'),card('主站内页 / 子域引用行',number(c.officialLayers.mainSitePage)+' / '+number(c.officialLayers.subdomain),'样本内 URL 去重后的内页与子域引用行；三层分别统计。')
      ];
      const domains=c.topDomains.map(item=>({name:item.domain,share:c.normalizedCitationCount?item.count*100/c.normalizedCitationCount:0,count:item.count}));
      const types=Object.entries(c.sourceTypes).map(([name,count])=>({name,count,share:c.normalizedCitationCount?count*100/c.normalizedCitationCount:0}));
      return '<section class="section"><div class="section-head"><h2>引用指标</h2><p>URL 去跟踪参数后按样本去重</p></div><div class="kpis">'+cards.join('')+'</div></section><section class="section"><div class="section-head"><h2>来源结构</h2><p>域名和类型按规范化引用计数</p></div><div class="split"><div class="panel"><h3>Top 域名</h3>'+bars(domains,'name','share')+'</div><div class="panel"><h3>来源类型</h3>'+bars(types,'name','share')+'</div></div></section>';
    }
    Promise.all([fetch('./data.json').then(r=>r.json()),fetch('./analysis.json').then(r=>r.json())]).then(([data,report])=>{
      document.querySelector('[data-snapshot]').textContent=report.snapshotId;
      document.querySelector('[data-planned]').textContent=number(report.totals.planned);
      document.querySelector('[data-valid]').textContent=number(report.totals.valid);
      document.querySelector('[data-hash]').textContent=report.sourceDataHash;
      document.querySelector('[data-status]').textContent=report.status;
      const callout=document.querySelector('[data-callout] span');callout.textContent=report.status==='FULL'?'累计数据已冻结；G-H 仅有 D2 两次观测。引用覆盖表示任意来源 URL，不等于品牌提及或官网引用。':'PARTIAL：缺口与 unknown 均保留，不按零计入有效分母。引用覆盖表示任意来源 URL。';
      const mount=document.querySelector('[data-view]');
      const tabs=[...document.querySelectorAll('[data-group]')];
      const render=group=>{const slice=group==='total'?report.totals:report.groups[group];const label=group==='total'?'全部问题组':group+' 组 · '+slice.groupName;mount.innerHTML='<div class="view-context"><b>'+label+'</b><span>'+number(slice.valid)+' / '+number(slice.planned)+' 个有效槽位 · '+number(slice.unknown)+' 个 unknown</span></div>'+(VIEW==='citation'?citation(slice):sampling(slice,report))};
      const activate=button=>{tabs.forEach(item=>{const selected=item===button;item.setAttribute('aria-selected',String(selected));item.tabIndex=selected?0:-1});mount.setAttribute('aria-labelledby',button.id);render(button.dataset.group)};
      tabs.forEach((button,index)=>{button.addEventListener('click',()=>activate(button));button.addEventListener('keydown',event=>{let next=null;if(event.key==='ArrowRight')next=(index+1)%tabs.length;if(event.key==='ArrowLeft')next=(index-1+tabs.length)%tabs.length;if(event.key==='Home')next=0;if(event.key==='End')next=tabs.length-1;if(next!==null){event.preventDefault();tabs[next].focus();activate(tabs[next])}})});
      render('total');
      window.__MAKAPLANET_DASHBOARD_READY__={view:VIEW,dataHash:report.sourceDataHash,planned:data.samples.length,status:report.status,snapshotId:report.snapshotId};
    }).catch(error=>{document.querySelector('[data-status]').textContent='数据加载失败';document.querySelector('[data-view]').innerHTML='<div class="panel empty">'+String(error.message||error)+'</div>';console.error(error)});
  </script>
</body></html>
