CT"],.fact-status[data-status="CONTRADICTED"]{color:var(--danger);border-color:#e0a19b}.fact-status[data-status="UNKNOWN"],.fact-status[data-status="NOT_COVERED"]{color:var(--muted);background:#f4f6f6}.fact-item h3{margin:0;font-size:13px}.fact-item p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.6}.fact-claims{margin-top:10px}.fact-evidence{max-width:360px;white-space:normal;line-height:1.55}

<body><div id="geo-shell-root" aria-label="全局导航"></div><a class="skip" href="#main">跳到主要内容</a><header><div class="head"><div class="head-row"><div><p class="eyebrow">MAKAPLANET · AIDSO FAST_WEB · 冻结终态</p><h1>玛卡星球 GEO 数据仪表盘</h1><p>424 条有效回答，支持芙崽与可豆陪陪切换对比，保留 A-H 分组与 G 组品牌事实证据。</p></div><span class="status" data-status>读取中</span></div><div class="meta"><span>快照 <b data-snapshot>--</b></span><span>计划槽位 <b data-planned>--</b></span><span>有效回答 <b data-valid>--</b></span><span>数据哈希 <b class="hash" data-hash>--</b></span></div><nav class="product-nav" aria-label="玛卡星球产品页面"><a href="../makaplanet-overview/">产品总览</a><a href="./" aria-current="page">数据仪表盘</a><a href="../makaplanet-citation/">引用源仪表盘</a></nav></div></header><main id="main"><div class="callout" data-callout><b>数据边界</b><span>正在读取冻结数据。</span></div><div class="tabs" role="tablist" aria-label="问题组"><button role="tab" aria-selected="true" data-group="total">总览</button><button role="tab" aria-selected="false" data-group="A">A 组</button><button role="tab" aria-selected="false" data-group="B">B 组</button><button role="tab" aria-selected="false" data-group="C">C 组</button><button role="tab" aria-selected="false" data-group="D">D 组</button><button role="tab" aria-selected="false" data-group="E">E 组</button><button role="tab" aria-selected="false" data-group="F">F 组</button><button role="tab" aria-selected="false" data-group="G">G 组</button><button role="tab" aria-selected="false" data-group="H">H 组</button></div><div data-view role="tabpanel" tabindex="0" aria-live="polite"></div></main><script>
    const VIEW="sampling";
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const pct=value=>value==null?'数据不足':Number(value).toFixed(2).replace(/\.00$/,'')+'%';
    const num=value=>Number(value||0).toLocaleString('zh-CN');
    const metric=(slice,id)=>slice.metrics?.[id]||{};
    const safeUrl=value=>{try{const url=new URL(String(value));return ['http:','https:'].includes(url.protocol)?url.href:'#'}catch{return '#'}};
    const card=(label,value,note,status='READY')=>'<div class="kpi" data-status="'+esc(status)+'"><small>'+esc(label)+'</small><strong>'+esc(value)+'</strong><span>'+esc(note)+'</span></div>';
    const bars=(rows,labelKey='name',valueKey='share')=>rows.length?rows.map(row=>'<div class="bar"><span>'+esc(row[labelKey])+'</span><div class="track"><div class="fill" style="width:'+Math.max(0,Math.min(100,Number(row[valueKey]||0)))+'%"></div></div><b>'+pct(row[valueKey])+'</b></div>').join(''):'<div class="empty">暂无可比较数据</div>';
    const section=(title,note,body)=>'<section class="section"><div class="section-head"><h2>'+esc(title)+'</h2><p>'+esc(note)+'</p></div>'+body+'</section>';
    const table=(headers,rows)=>'<div class="table-wrap" tabindex="0" role="region" aria-label="可横向滚动的数据表"><table class="table"><thead><tr>'+headers.map(item=>'<th>'+esc(item)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
    const rateCell=m=>'<td class="num">'+pct(m?.percentage)+'<span class="metric-note">'+num(m?.numerator)+' / '+num(m?.denominator)+'</span></td>';
    function profile(report,group){if(group==='total')return '';const p=report.groupProfiles?.[group];if(!p)return '';return '<div class="callout"><b>'+esc(group)+' 组 · '+esc(p.groupName)+'</b><span>'+esc(p.definition)+' 示例：'+esc(p.exampleQuestion||'暂无')+'</span></div>'}
    function highFrequency(slice){const rows=(slice.citation?.urlDetails||[]).slice(0,15).map((row,index)=>'<tr><td class="num">'+(index+1)+'</td><td class="source-title">'+esc(row.title||row.siteName||'未提供标题')+'</td><td class="url"><a href="'+esc(safeUrl(row.url))+'" target="_blank" rel="noopener noreferrer">'+esc(row.url)+'</a></td><td>'+esc(row.sourceType)+'</td><td class="num">'+num(row.citationCount)+'<span class="metric-note">不去重</span></td><td class="num">'+num(row.coverageAnswers)+'<span class="metric-note">回答去重</span></td><td class="num">'+num(row.coverageQuestions)+'</td></tr>');return table(['#','页面','网址','来源类型','引用次数','覆盖回答','覆盖问题'],rows)}
    function competitorCards(row,report){const observationLabel=report.observationStage==='FINAL_FOUR_OBSERVATIONS'?'四次观测终态':report.observationStage==='MIXED_4_AND_2_OBSERVATIONS'?'混合观测阶段':'两次观测临时结果';return [card('完成率',pct(row.completion?.percentage),'有效回答 '+num(row.completion?.numerator)+' / 计划槽位 '+num(row.completion?.denominator)),card('品牌提及率',pct(row.mentionDenominator?row.mentionCount*100/row.mentionDenominator:null),'回答正文提到'+row.brand+'：'+num(row.mentionCount)+' / '+num(row.mentionDenominator)),card('普通首推率',pct(row.mentionDenominator?row.firstCount*100/row.mentionDenominator:null),row.brand+'在可识别推荐顺序中排第 1；分母为全部有效回答：'+num(row.firstCount)+' / '+num(row.mentionDenominator)),card('前三率',pct(row.mentionDenominator?row.top3Count*100/row.mentionDenominator:null),row.brand+'位于可识别推荐顺序前 3；分母为全部有效回答：'+num(row.top3Count)+' / '+num(row.mentionDenominator)),card('平均排名',row.averageRank??'数据不足','仅统计能识别到'+row.brand+'排名的 '+num(row.rankedAnswerCount)+' 条回答；数值越小越靠前'),card('严格优势表达率',pct(row.strictAdvantage?.percentage),'回答正文同时出现'+row.brand+'和明确正向优势表达：'+num(row.strictAdvantage?.numerator)+' / '+num(row.strictAdvantage?.denominator)),card('商品卡出现率',pct(row.productCard?.percentage),'回答正文或结构化商品卡含'+row.brand+'可点击购买链接：'+num(row.productCard?.numerator)+' / '+num(row.productCard?.denominator)),card('竞品品牌-回答命中',num(row.otherBrandMentions?.total),'以'+row.brand+'为当前品牌；其他登记品牌按回答分别统计后求和，同一回答可重复计数'),card('回答引用覆盖率',pct(row.citationCoverage?.percentage),'引用列表含至少 1 个有效 URL 的回答；不代表'+row.brand+'或官网出现：'+num(row.citationCoverage?.numerator)+' / '+num(row.citationCoverage?.denominator)),card(row.brand+'官网引用覆盖率',pct(row.officialSourceCoverage?.percentage),'引用列表含 '+(row.officialHosts||[]).join('、')+' 首页、内页或子域的回答：'+num(row.officialSourceCoverage?.numerator)+' / '+num(row.officialSourceCoverage?.denominator)),card('有效回答',num(row.valid),'计划 '+num(row.completion?.denominator)+'；unknown '+num(row.unknown)),card('结论阶段',observationLabel,'每题目标 4 次有效观测；不足部分在逐题表显示当前缺口')];}
    function competitorModule(slice,report){const rows=slice.brandComparison?.competitors||[];if(!rows.length)return '<div class="empty">暂无竞品指标</div>';return '<div class="brand-switch" role="tablist" aria-label="竞品选择">'+rows.map((row,index)=>'<button type="button" role="tab" id="competitor-tab-'+index+'" aria-controls="competitor-kpis" aria-selected="'+String(index===0)+'" tabindex="'+(index===0?0:-1)+'" data-competitor="'+esc(row.brand)+'">'+esc(row.brand)+'</button>').join('')+'</div><div class="kpis" id="competitor-kpis" role="tabpanel" tabindex="0" aria-live="polite" aria-labelledby="competitor-tab-0" data-competitor-kpis>'+competitorCards(rows[0],report).join('')+'</div>'}
    function bindCompetitorSwitch(slice,report){const buttons=[...document.querySelectorAll('[data-competitor]')];const mount=document.querySelector('[data-competitor-kpis]');if(!mount)return;const activate=(button,focus=false)=>{buttons.forEach(item=>{const selected=item===button;item.setAttribute('aria-selected',String(selected));item.tabIndex=selected?0:-1});mount.setAttribute('aria-labelledby',button.id);const row=(slice.brandComparison?.competitors||[]).find(item=>item.brand===button.dataset.competitor);if(row)mount.innerHTML=competitorCards(row,report).join('');if(focus)button.focus()};buttons.forEach(button=>{button.addEventListener('click',()=>activate(button));button.addEventListener('keydown',event=>{const keys=['ArrowLeft','ArrowRight','Home','End'];if(!keys.includes(event.key))return;event.preventDefault();const current=buttons.indexOf(button);const next=event.key==='Home'?0:event.key==='End'?buttons.length-1:event.key==='ArrowRight'?(current+1)%buttons.length:(current-1+buttons.length)%buttons.length;activate(buttons[next],true)})})}
    function questionTable(report,group){const items=(report.questionComparisons||[]).filter(item=>group==='total'||item.groupId===group);const factColumns=group==='G';const rows=items.map(item=>'<tr><td>'+esc(item.questionId)+'</td><td class="category">'+esc(item.category)+'</td><td class="question">'+esc(item.questionText)+'</td>'+rateCell(item.mention)+rateCell(item.ordinaryFirst)+rateCell(item.top3)+rateCell(item.strictAdvantage)+'<td class="num">'+(item.averageRank?.value==null?'数据不足':esc(item.averageRank.value))+'<span class="metric-note">'+num(item.averageRank?.denominator)+' 条可排名</span></td>'+(factColumns?rateCell(item.brandFactCorrectness?.accuracy)+rateCell(item.brandFactCorrectness?.assessability):'')+'<td class="num '+(item.currentGap?'warning':'ok')+'">'+num(item.currentGap)+'<span class="metric-note">目标 4 次 / 有效 '+num(item.valid)+'</span></td></tr>');const headers=['问题ID','分类口径','问题','提及率','普通首推率','前三率','严格优势表达','平均排名'];if(factColumns)headers.push('事实正确率','官网可判定率');headers.push('当前缺口');return table(headers,rows)}

 3 页面集中度',pct(c.concentration.top3Share),'前三高频页面原始引用次数 / 全部有效原始引用'),card('Top 10 页面集中度',pct(c.concentration.top10Share),'前十高频页面原始引用次数 / 全部有效原始引用'),card('URL HHI',num(c.concentration.hhi),'按原始有效引用的 URL 份额平方和 × 10,000；越高越集中')];const account=[card('账号/互动字段覆盖率',pct(c.accountInteraction.coveragePercentage),'含账号名、粉丝量或点赞量任一字段的原始引用：'+num(c.accountInteraction.evidenceRows)+' / '+num(c.accountInteraction.denominator),c.accountInteraction.evidenceRows?'READY':'UNRESOLVED'),card('可识别账号数',num(c.accountInteraction.accountCount),'按冻结引用字段中的账号名去重；未采集不按 0 账号解释',c.accountInteraction.evidenceRows?'READY':'UNRESOLVED')];return profile(report,group)+section('核心结论','先给可直接使用的结论，再展开统计证据',conclusions(citationCore(slice)))+section('引用指标','所有指标注明去重层级、分子和分母','<div class="kpis">'+cards.join('')+'</div>')+section('内容新旧','只接受冻结引用字段中的明确发布日期，不从 URL 或标题推断','<div class="kpis">'+freshnessCards.join('')+'</div>')+section('来源结构 · 集中度和来源属性','集中度按原始有效 URL 行；来源类型沿用采集端 category 字段','<div class="kpis">'+concentration.join('')+'</div><div style="height:12px"></div><div class="split"><div class="panel"><h3>来源类型</h3><p class="caption">采集端 category；引用次数不去重</p>'+sourceTypes(c)+'</div><div class="panel"><h3>来源属性</h3><p class="caption">按域名归为官方、社交、媒体、社区或其他</p>'+sourceAttributes(c)+'</div></div>')+section('高频引用页面','引用次数不去重；覆盖回答和覆盖问题去重',highFrequency(slice))+section('网址与合作','支持检索当前页签全部唯一 URL；合作候选只依据本次引用体量','<div class="callout"><b>候选筛选边界</b><span>优先核验非玛卡官方的高频域名和页面。正式接洽前需另查公司主体、业务匹配、联系方式与授权状态。</span></div>'+allUrls(c))+section('账号与互动','冻结数据没有相应字段时必须显示数据不足，不用站点名替代账号身份','<div class="kpis">'+account.join('')+'</div><div class="callout"><b>限制</b><span>'+esc(c.accountInteraction.limitation||'账号与互动只覆盖部分引用，不能外推全部来源。')+'</span></div>')+section('最终回答','严格区分“已引用来源分布”和“算法选择偏好”',finalAnswers(c))+section('质量与限制','所有回答和引用均可回到冻结数据逐条复核','<div class="module-list"><article><h3>同一冻结数据</h3><p>采样与引用仪表盘读取同一 data.json 字节与同一 SHA-256；分析文件也保持一致。</p></article><article><h3>引用不等于品牌出现</h3><p>引用覆盖只表示回答附带任意有效 URL；品牌提及和玛卡官网引用分别统计。</p></article><article><h3>发布日期缺失</h3><p>published_at 缺失即记 unknown，不从网址路径、标题年份或当前时间推断。</p></article><article><h3>不能推断权重</h3><p>没有未引用候选集合，不能从引用份额判断搜索排序、平台偏好或因果权重。</p></article></div>')+section('数据文件','本地只读文件；公开部署前仍需用户再次确认','<div class="downloads"><a class="download" href="./data.json" download>冻结样本 data.json</a><a class="download" href="./analysis.json" download>分析结果 analysis.json</a></div>')+section('逐题回答与引用网页明细','先选择问题，再查看该题四次回答和每次回答的原始引用列表',answerDetails(data,report,group));}
    Promise.all([fetch('./data.json').then(r=>{if(!r.ok)throw new Error('data.json '+r.status);return r.json()}),fetch('./analysis.json').then(r=>{if(!r.ok)throw new Error('analysis.json '+r.status);return r.json()})]).then(([data,report])=>{document.querySelector('[data-snapshot]').textContent=report.snapshotId;document.querySelector('[data-planned]').textContent=num(report.totals.planned);document.querySelector('[data-valid]').textContent=num(report.totals.valid);document.querySelector('[data-hash]').textContent=report.sourceDataHash;document.querySelector('[data-status]').textContent=report.status;document.querySelector('[data-callout] span').textContent=report.status==='FULL'?'累计 424 条有效回答已冻结；A-H 每题均有 4 次观测。引用覆盖表示任意来源 URL，不等于品牌提及或官网出现。':'PARTIAL：缺口与 unknown 保留，不按零计入有效分母。';const mount=document.querySelector('[data-view]');const render=group=>{const slice=group==='total'?report.totals:report.groups[group];mount.innerHTML=VIEW==='citation'?citation(slice,report,group,data):sampling(slice,report,group);if(VIEW==='citation')bindUrlSearch(slice.citation);if(VIEW==='sampling'){bindCompetitorSwitch(slice,report);if(group==='G')renderFactEvidence(slice.brandFactCorrectness)}const select=document.querySelector('#question-select');if(select){renderAnswers(data,report,select.value);select.addEventListener('change',()=>renderAnswers(data,report,select.value))}};const tabs=Array.from(document.querySelectorAll('[data-group]'));const activate=button=>{tabs.forEach(item=>{const selected=item===button;item.setAttribute('aria-selected',String(selected));item.tabIndex=selected?0:-1});render(button.dataset.group)};tabs.forEach((button,index)=>{button.tabIndex=index===0?0:-1;button.addEventListener('click',()=>activate(button));button.addEventListener('keydown',event=>{const keys=['ArrowLeft','ArrowRight','Home','End'];if(!keys.includes(event.key))return;event.preventDefault();const current=tabs.indexOf(button);const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:event.key==='ArrowRight'?(current+1)%tabs.length:(current-1+tabs.length)%tabs.length;activate(tabs[next]);tabs[next].focus()})});render('total');window.__MAKAPLANET_DASHBOARD_READY__={view:VIEW,dataHash:report.sourceDataHash,planned:data.samples.length,version:'V8'}}).catch(error=>{document.querySelector('[data-status]').textContent='数据加载失败';document.querySelector('[data-view]').innerHTML='<div class="panel empty">'+esc(error.message||error)+'</div>';console.error(error)});
  </script></body></html>
