<script>const ASSETS={"model":"./assets/model.26f2440d52f3.webp","context":"./assets/context.9f10c72fec36.webp","tools":"./assets/tools.606db7f1106a.webp","harness":"./assets/harness.b7c056d16b97.webp","paper":"./assets/paper.5ed78dd11afe.webp"};const ICONS={"book":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 7v14\"/><path d=\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\"/></svg>","shield":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"/><path d=\"m9 12 2 2 4-4\"/></svg>","lock":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"16\" r=\"1\"/><rect x=\"3\" y=\"10\" width=\"18\" height=\"12\" rx=\"2\"/><path d=\"M7 10V7a5 5 0 0 1 10 0v3\"/></svg>","check":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg>","loop":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m2 9 3-3 3 3\"/><path d=\"M13 18H7a2 2 0 0 1-2-2V6\"/><path d=\"m22 15-3 3-3-3\"/><path d=\"M11 6h6a2 2 0 0 1 2 2v10\"/></svg>","play":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z\"/></svg>","pause":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"14\" y=\"3\" width=\"5\" height=\"18\" rx=\"1\"/><rect x=\"5\" y=\"3\" width=\"5\" height=\"18\" rx=\"1\"/></svg>"};const ROBOT_RATIO=0.6666666666666666;</script><script>const stage=document.querySelector('#stage'),robot=document.querySelector('#robot-position'),floor=document.querySelector('#floor');
const wire=document.querySelector('#wire'),wireUnder=document.querySelector('#wire-under'),anchor=document.querySelector('#anchor');
const names={model:'模型芯片',context:'上下文资料舱',tools:'执行工具',harness:'运行框架',skill:'工作方法册',loop:'运行循环'};
const annotations={
  model:{tag:'LLM',side:'left',title:'模型芯片',text:'理解当前上下文，生成下一步。',chips:['理解','判断','生成']},
  context:{tag:'CONTEXT',side:'left',title:'上下文资料舱',text:'本轮提供给模型的信息。',chips:['环境','身份','输入']},
  tools:{tag:'TOOLS',side:'left',title:'可用工具',text:'读取、写入并把结果带回来。',chips:['读','写','检索','编辑']},
  harness:{tag:'HARNESS',side:'left',title:'运行框架',text:'管理上下文，连接工具，控制运行。',harness:true},
  skill:{tag:'SKILL',side:'left',title:'工作方法册',text:'Agent 按需调用的可复用方法。',chips:['规则','步骤','验收']},
  loop:{tag:'LOOP',side:'left',title:'运行循环',text:'观察结果，再决定下一步行动。',chips:['观察','行动','反馈']}
};
const origins={model:[.5,.13],context:[.44,.29],tools:[.76,.54],harness:[.5,.42],skill:[.25,.54],loop:[.58,.28]};
const motionPreference=matchMedia('(prefers-reduced-motion: reduce)');
let reduced=motionPreference.matches,selected=null,raf=0,lastTime=0,settled=true,loopTimer=0,loopStep=0;
const bodies={};
const robotState={x:0,y:0,s:1,o:1,vx:0,vy:0,vs:0,vo:0,target:{x:0,y:0,s:1,o:1}};
function renderAnnotations(name){
  const host=document.querySelector('#annotations');host.innerHTML='';if(!name)return;
  if(name==='harness'){
    host.innerHTML=`
      <div class="harness-title"><strong>运行框架</strong><span>HARNESS</span></div>
      <article class="annotation harness-main left" data-anchor="context">
        <h3>上下文管理<span>CONTEXT</span></h3>
        <p>组装本轮交给模型的信息</p>
        <div class="context-list"><span>环境信息</span><span>身份信息</span><span>记忆</span><span>本次输入</span></div>
      </article>
      <article class="annotation harness-llm left" data-anchor="tools">
        <h3>工具连接<span>TOOLS</span></h3><p>调用工具，接回执行结果</p>
      </article>
      <article class="annotation harness-control left" data-anchor="loop">
        <h3>运行与控制<span>LOOP</span></h3><p>观察 → 行动 → 反馈<br>检查边界，继续或停止</p>
      </article>
      <div class="harness-equation"><b>Agent</b> = Model + Harness<span class="harness-summary">（上下文 + 工具）</span></div>`;
    return;
  }
  const a=annotations[name],card=document.createElement('article');card.className=`annotation ${name} ${a.side}`;card.dataset.anchor=name;
  card.innerHTML=`<h3>${a.title}<span>${a.tag}</span></h3><p>${a.text}</p><div class="terms">${a.chips?.map(x=>`<span>${x}</span>`).join('')||''}</div>`;
  host.append(card);
}
for(const name of Object.keys(names)){
  const el=document.createElement(name==='loop'?'div':'button');el.className='part';el.dataset.part=name;el.setAttribute('aria-label',names[name]);el.tabIndex=-1;
  if(name==='loop')el.setAttribute('role','group');
  el.innerHTML=name==='loop'?`<div class="loop-machine"><svg viewBox="0 0 400 400" aria-hidden="true"><path class="loop-edge" d="M125 100 Q290 30 315 200 Q270 365 125 300 Q10 200 125 100Z"/></svg><button class="loop-node" data-step="0" aria-label="观察" aria-pressed="true"><img data-src="${ASSETS.context}" alt=""/><span>观察</span></button><button class="loop-node" data-step="1" aria-label="行动" aria-pressed="false"><img data-src="${ASSETS.tools}" alt=""/><span>行动</span></button><button class="loop-node" data-step="2" aria-label="反馈" aria-pressed="false">${ICONS.check}<span>反馈</span></button><button id="loop-play" aria-label="播放循环" title="播放循环">${ICONS.play}</button></div>`:name==='skill'?`<span class="surface"><span class="method-book">${ICONS.book}</span></span>`:`<span class="surface"><img data-src="${ASSETS[name]}" alt="${names[name]}" draggable="false"></span>`;
  document.querySelector('#parts-layer').append(el);
  bodies[name]={el,x:0,y:0,s:.05,o:0,r:0,vx:0,vy:0,vs:0,vo:0,vr:0,target:{x:0,y:0,s:.05,o:0,r:0}};
  el.addEventListener('click',e=>{e.stopPropagation();if(el.dataset.assets==='error'){loadPart(name,true);return;}if(name!=='loop')el.classList.toggle('inspect');});
  el.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const b=el.getBoundingClientRect(),dx=(e.clientX-b.left)/b.width-.5,dy=(e.clientY-b.top)/b.height-.5;el.style.setProperty('--px',`${dx*10}px`);el.style.setProperty('--py',`${dy*8}px`);el.style.setProperty('--pr',`${dx*1.3}deg`);});
  el.addEventListener('pointerleave',()=>{el.style.setProperty('--px','0px');el.style.setProperty('--py','0px');el.style.setProperty('--pr','0deg');});
}
let robotReady=false;
function updateReady(){document.documentElement.dataset.ready=String(robotReady&&(!selected||bodies[selected].el.dataset.assets==='ready'));}
function loadPart(name,retry=false){
  const el=bodies[name].el;if(el.dataset.assets==='ready'||el.dataset.assets==='loading'||(el.dataset.assets==='error'&&!retry))return;
  el.dataset.assets='loading';el.setAttribute('aria-busy','true');
  const images=[...el.querySelectorAll('img[data-src]')];
  Promise.all(images.map(img=>{img.src=img.dataset.src;return img.decode();})).then(()=>{
    el.dataset.assets='ready';el.setAttribute('aria-busy','false');el.setAttribute('aria-label',names[name]);updateReady();
  }).catch(()=>{el.dataset.assets='error';el.setAttribute('aria-busy','false');el.setAttribute('aria-label',names[name]+'加载失败，点击重试');updateReady();});
}
function setLoopStep(step){loopStep=step%3;stage.dataset.phase=['context','tools','feedback'][loopStep];document.querySelectorAll('.loop-node').forEach((el,i)=>el.setAttribute('aria-pressed',String(i===loopStep)));}
function stopLoop(){clearInterval(loopTimer);loopTimer=0;const el=document.querySelector('#loop-play');el.innerHTML=ICONS.play;el.setAttribute('aria-label','播放循环');el.title='播放循环';}
document.querySelectorAll('.loop-node').forEach(el=>el.addEventListener('click',()=>{stopLoop();setLoopStep(Number(el.dataset.step));}));
document.querySelector('#loop-play').addEventListener('click',()=>{if(loopTimer){stopLoop();return;}setLoopStep(loopStep+1);loopTimer=setInterval(()=>{if(selected!=='loop'||document.hidden){stopLoop();return;}setLoopStep(loopStep+1);},1600);const el=document.querySelector('#loop-play');el.innerHTML=ICONS.pause;el.setAttribute('aria-label','暂停循环');el.title='暂停循环';});
function layout(){
  const w=innerWidth,h=innerHeight,mobile=w<700;
  const rh=Math.min(h*(mobile?.8:.89),w*(mobile?1.6:.9)),rw=rh*ROBOT_RATIO;
  robot.style.width=rw+'px';robot.style.height=rh+'px';
  const center={x:(w-rw)/2,y:(h-rh)/2-3};
  const harnessMode=selected==='harness';
  const display=mobile?(harnessMode?{x:(w-rw*.45)/2,y:h*.13,s:.45}:{x:(w-rw*.69)/2,y:h*.37,s:.69}):{x:w*.42-rw*.90/2,y:center.y+rh*.05,s:.90};
  const rp=selected?display:{...center,s:1};
  Object.assign(robotState.target,rp);
  const size=mobile?Math.min(w*.71,h*.36):Math.min(w*.31,h*.54,590);
  for(const [name,b]of Object.entries(bodies)){
    b.size=size;b.el.style.width=size+'px';b.el.style.height=size+'px';
    const origin=origins[name];
    const start={x:rp.x+rw*rp.s*origin[0]-size/2,y:rp.y+rh*rp.s*origin[1]-size/2};
    const dest=mobile?(harnessMode?{x:(w-size)/2,y:h*.02}:{x:(w-size)/2,y:h*.055}):{x:w*.78-size/2,y:h*.48-size/2};
    b.target=name===selected?{...dest,s:1,o:1,r:0}:{...start,s:.04,o:0,r:name==='tools'?12:-8};
    if(!selected&&b.o<.001)Object.assign(b,b.target);
  }
  return {w,h,rw,rh};
}
function select(name,toggle=false){
  if(!names[name])name=null;
  if(toggle&&name===selected)name=null;
  stopLoop();delete stage.dataset.phase;
  const previous=selected;selected=name;
  stage.dataset.part=selected||'';
  renderAnnotations(selected);
  document.body.classList.toggle('expanded',!!selected);
  document.querySelectorAll('.hotspot').forEach(el=>el.setAttribute('aria-expanded',String(el.dataset.part===selected)));
  for(const [key,b]of Object.entries(bodies)){b.el.classList.toggle('active',key===selected);b.el.tabIndex=key===selected?0:-1;b.el.classList.remove('inspect');}
  if(selected)loadPart(selected);updateReady();
  try{history.replaceState(null,'','#'+(selected||'overview'));}catch{location.hash=selected||'overview';}
  if(name==='loop')setLoopStep(0);
  const geo=layout();
  if(name&&bodies[name].o<.02){
    const b=bodies[name],origin=origins[name];
    b.x=robotState.x+geo.rw*robotState.s*origin[0]-b.size/2;
    b.y=robotState.y+geo.rh*robotState.s*origin[1]-b.size/2;
    b.s=.07;b.o=0;b.r=previous?8:-8;b.vx=b.vy=b.vs=b.vo=b.vr=0;
  }
  start();
}
function start(){settled=false;if(!raf){lastTime=performance.now();raf=requestAnimationFrame(frame);}}
function spring(obj,key,dt,k=120,c=22){const v='v'+key;const difference=obj.target[key]-obj[key];const opacity=key==='o';const speed=opacity?360:k;const damping=opacity?32:c;obj[v]+=(difference*speed-obj[v]*damping)*dt;obj[key]+=obj[v]*dt;return Math.abs(difference)<(opacity?.035:.035)&&Math.abs(obj[v])<.07;}
function render(){
  robot.style.transform=`translate3d(${robotState.x}px,${robotState.y}px,0) scale(${robotState.s})`;robot.style.transformOrigin='0 0';
  const rw=parseFloat(robot.style.width),rh=parseFloat(robot.style.height),footX=robotState.x+rw*robotState.s/2,footY=robotState.y+rh*robotState.s*.96;
  floor.style.left=footX+'px';floor.style.top=footY+'px';floor.style.transform=`scale(${robotState.s})`;
  for(const b of Object.values(bodies)){
    b.el.style.transform=`translate3d(${b.x}px,${b.y}px,0) scale(${Math.max(.001,b.s)}) rotate(${b.r}deg)`;
    b.el.style.opacity=Math.max(0,Math.min(1,b.o));b.el.style.visibility=b.o<.055?'hidden':'visible';
  }
  if(selected){
    const b=bodies[selected],origin=origins[selected],mobile=innerWidth<700;
    const sx=robotState.x+rw*robotState.s*origin[0],sy=robotState.y+rh*robotState.s*origin[1];
    const ex=b.x+b.size*(mobile?.5:.17),ey=b.y+b.size*(mobile?.9:.55);
    const d=mobile?`M ${sx} ${sy} C ${sx} ${sy-55},${ex} ${ey+55},${ex} ${ey}`:`M ${sx} ${sy} C ${sx+90} ${sy},${ex-80} ${ey},${ex} ${ey}`;
    wire.setAttribute('d',d);wireUnder.setAttribute('d',d);anchor.setAttribute('cx',sx);anchor.setAttribute('cy',sy);
    const labels=[...document.querySelectorAll('.annotation[data-anchor]')];
    if(labels.length&&!mobile){
      const paths=labels.map(label=>{
        const anchorName=label.dataset.anchor,originLabel=origins[anchorName]||origins[selected],rect=label.getBoundingClientRect();
        const ax=robotState.x+rw*robotState.s*originLabel[0],ay=robotState.y+rh*robotState.s*originLabel[1];
        const side=label.classList.contains('left')?'left':'right',tx=side==='left'?rect.right:rect.left,ty=rect.top+Math.min(30,rect.height*.5),lx=side==='left'?tx+54:tx-54;
        return `M ${ax} ${ay} C ${lx} ${ay},${lx} ${ty},${tx} ${ty}`;
      }).join(' ');
      document.querySelector('#label-wire').setAttribute('d',paths);
      document.querySelector('#label-wire').style.opacity=String(Math.max(0,(b.o-.2)*.75));
    }else document.querySelector('#label-wire').style.opacity='0';
    document.querySelector('#connections').style.opacity=String(Math.max(0,(b.o-.4)*.52));
  }else{document.querySelector('#connections').style.opacity='0';document.querySelector('#label-wire').style.opacity='0';}
}
function frame(now){
  const dt=Math.min((now-lastTime)/1000,.024);lastTime=now;let done=true;
  for(const obj of [robotState,...Object.values(bodies)]){
    for(const key of Object.keys(obj.target)){
      if(reduced){obj[key]=obj.target[key];obj['v'+key]=0;}else if(!spring(obj,key,dt,key==='o'?160:120,key==='o'?26:22))done=false;
    }
  }
  render();settled=done;
  if(done){for(const obj of [robotState,...Object.values(bodies)])for(const key of Object.keys(obj.target)){obj[key]=obj.target[key];obj['v'+key]=0;}render();raf=0;return;}raf=requestAnimationFrame(frame);
}
document.querySelectorAll('.hotspot').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();select(el.dataset.part,true);}));
stage.addEventListener('click',e=>{if(!e.target.closest('button'))select(null);});
document.querySelector('#assemble').addEventListener('click',e=>{e.stopPropagation();select(null);});
document.querySelector('#fullscreen').addEventListener('click',e=>{e.stopPropagation();(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{});});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){select(null);return;}if(['1','2','3','4','5','6'].includes(e.key)&&!e.repeat)select(Object.keys(names)[Number(e.key)-1]);});
motionPreference.addEventListener('change',e=>{reduced=e.matches;if(reduced)stopLoop();start();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopLoop();});
window.addEventListener('resize',()=>{layout();start();});
window.addEventListener('hashchange',()=>{const part=location.hash.slice(1);if(part!==(selected||'overview'))select(part);});
layout();Object.assign(robotState,robotState.target);render();
const hash=location.hash.slice(1);if(names[hash])select(hash);
window.robotShowcase={select,close:()=>select(null),getState:()=>({selected,settled,loopStep,loopPlaying:!!loopTimer,reduced,assetState:selected?bodies[selected].el.dataset.assets:'ready'}),parts:Object.keys(names)};
document.documentElement.dataset.initialized='true';
document.querySelector('#robot').decode().then(()=>{robotReady=true;updateReady();}).catch(()=>{document.documentElement.dataset.ready='false';document.documentElement.dataset.robotError='true';});
const paper=new Image();paper.src=ASSETS.paper;paper.decode().then(()=>{stage.style.backgroundImage=`url("${ASSETS.paper}")`;document.documentElement.dataset.backgroundReady='true';}).catch(()=>{document.documentElement.dataset.backgroundReady='false';});
</script></body></html>
