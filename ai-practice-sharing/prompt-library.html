<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>AI 实践分享提示词库</title>
    <style>
      :root {
        --ink: #171d19;
        --muted: #65716a;
        --paper: #f5f1e7;
        --paper-2: #ece7da;
        --green: #0d725f;
        --orange: #d75438;
        --line: rgba(23, 29, 25, 0.2);
        --shadow: rgba(41, 24, 13, 0.2);
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        color: var(--ink);
        background:
          linear-gradient(rgba(27, 82, 65, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(27, 82, 65, 0.05) 1px, transparent 1px),
          var(--paper);
        background-size: 28px 28px;
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      button,
      select {
        color: inherit;
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .reader {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        width: 100%;
        height: 100%;
        padding: clamp(0.55rem, 1.4vw, 1rem);
        gap: clamp(0.4rem, 1vw, 0.7rem);
      }

      .topbar,
      .prompt-meta,
      .reader-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: clamp(0.45rem, 1vw, 0.8rem);
      }

      .brand {
        min-width: 0;
      }

      .brand strong {
        display: block;
        font-family: "STSong", "SimSun", serif;
        font-size: clamp(0.95rem, 2vw, 1.3rem);
        line-height: 1.15;
      }

      .brand span {
        display: block;
        margin-top: 0.15rem;
        color: var(--muted);
        font-size: clamp(0.62rem, 1.1vw, 0.78rem);
      }

      .prompt-switch {
        display: flex;
        gap: 0.35rem;
      }

      .switch-button,
      .copy-button,
      .nav-button,
      select {
        min-height: clamp(2rem, 4vw, 2.5rem);
        padding: 0.35rem 0.7rem;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.82);
        font-size: clamp(0.68rem, 1.25vw, 0.86rem);
      }

      .switch-button.active {
        color: #fff;
        border-color: var(--green);
        background: var(--green);
      }

      .copy-button {
        color: #fff;
        border-color: var(--ink);
        background: var(--ink);
        white-space: nowrap;
      }

      .prompt-meta {
        padding-top: clamp(0.35rem, 0.7vw, 0.55rem);
        border-top: 2px solid var(--ink);
      }

      .prompt-title {
        min-width: 0;
        font-size: clamp(0.72rem, 1.35vw, 0.92rem);
        font-weight: 700;
      }

      .segment-picker {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        min-width: min(58%, 28rem);
      }

      .segment-picker select {
        width: 100%;
        min-width: 0;
      }

      .page-count {
        flex: 0 0 auto;
        color: var(--muted);
        font-family: Consolas, monospace;
        font-size: clamp(0.62rem, 1.1vw, 0.78rem);
      }

      .prompt-page {
        position: relative;
        min-height: 0;
        overflow: hidden;
        padding: clamp(0.65rem, 1.35vw, 1rem);
        border: 1px solid var(--line);
        border-left: 5px solid var(--orange);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 8px 22px var(--shadow);
      }

      .prompt-page::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(105deg, transparent 0 74%, rgba(13, 114, 95, 0.04));
      }

      pre {
        position: relative;
        z-index: 1;
        height: 100%;
        margin: 0;
        overflow: hidden;
        color: #202822;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-family: "Microsoft YaHei", sans-serif;
        font-size: clamp(0.68rem, 1.2vw, 0.9rem);
        line-height: 1.52;
      }

      .reader-nav {
        justify-content: flex-end;
      }

      .nav-button {
        min-width: clamp(2.3rem, 4vw, 2.8rem);
        padding-inline: 0.55rem;
        font-size: clamp(1rem, 2vw, 1.25rem);
      }

      .nav-button:disabled {
        cursor: default;
        opacity: 0.35;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: clamp(0.6rem, 2vw, 1rem);
        z-index: 5;
        padding: 0.45rem 0.75rem;
        color: #fff;
        border-radius: 4px;
        background: var(--green);
        font-size: clamp(0.68rem, 1.2vw, 0.82rem);
        opacity: 0;
        transform: translate(-50%, 0.5rem);
        transition: opacity 180ms ease, transform 180ms ease;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (max-width: 680px) {
        .reader {
          padding: 0.45rem;
        }

        .topbar {
          align-items: flex-start;
        }

        .brand span {
          display: none;
        }

        .prompt-switch {
          display: none;
        }

        .prompt-meta {
          align-items: stretch;
          flex-direction: column;
        }

        .segment-picker {
          width: 100%;
          min-width: 0;
        }

        .reader-nav {
          justify-content: space-between;
        }
      }

      @media (max-height: 520px) {
        .brand span,
        .prompt-title {
          display: none;
        }

        .reader {
          gap: 0.3rem;
          padding: 0.35rem;
        }

        .prompt-meta {
          padding-top: 0.25rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="reader">
      <header class="topbar">
        <div class="brand">
          <strong id="promptName">提示词库</strong>
          <span>逐段查看，可复制完整版本</span>
        </div>
        <div class="prompt-switch" aria-label="选择提示词">
          <button class="switch-button" type="button" data-prompt="meeting-board">会议看板</button>
          <button class="switch-button" type="button" data-prompt="hotspot-skill">热点追踪</button>
        </div>
        <button class="copy-button" id="copyAll" type="button">复制全部</button>
      </header>

      <div class="prompt-meta">
        <div class="prompt-title" id="promptIntro"></div>
        <label class="segment-picker">
          <span class="page-count" id="pageCount"></span>
          <select id="sectionSelect" aria-label="选择提示词段落"></select>
        </label>
      </div>

      <section class="prompt-page" aria-live="polite">
        <pre id="promptText"></pre>
      </section>

      <nav class="reader-nav" aria-label="提示词翻页">
        <button class="nav-button" id="previousPage" type="button" title="上一段" aria-label="上一段">←</button>
        <button class="nav-button" id="nextPage" type="button" title="下一段" aria-label="下一段">→</button>
      </nav>
    </main>
    <div class="toast" id="toast">已复制完整提示词</div>

        count: document.querySelector("#pageCount"),
        select: document.querySelector("#sectionSelect"),
        previous: document.querySelector("#previousPage"),
        next: document.querySelector("#nextPage"),
        copy: document.querySelector("#copyAll"),
        toast: document.querySelector("#toast"),
      };

      function promptFromLocation() {
        const key = location.hash.replace("#", "");
        return prompts[key] ? key : "meeting-board";
      }

      function fitPrompt() {
        let size = Math.min(14.4, Math.max(10.4, innerWidth / 86));
        elements.text.style.fontSize = `${size}px`;
        while (elements.text.scrollHeight > elements.text.clientHeight + 2 && size > 8.6) {
          size -= 0.25;
          elements.text.style.fontSize = `${size}px`;
        }
      }

      function renderPrompt(resetPage = false) {
        const prompt = prompts[state.prompt];
        if (resetPage) state.page = 0;
        state.page = Math.max(0, Math.min(state.page, prompt.pages.length - 1));

        elements.name.textContent = prompt.name;
        elements.intro.textContent = prompt.intro;
        elements.count.textContent = `${state.page + 1} / ${prompt.pages.length}`;
        elements.select.innerHTML = prompt.pages
          .map((page, index) => `<option value="${index}">${String(index + 1).padStart(2, "0")} · ${page.title}</option>`)
          .join("");
        elements.select.value = String(state.page);
        elements.text.textContent = prompt.pages[state.page].text;
        elements.previous.disabled = state.page === 0;
        elements.next.disabled = state.page === prompt.pages.length - 1;

        document.querySelectorAll("[data-prompt]").forEach((button) => {
          button.classList.toggle("active", button.dataset.prompt === state.prompt);
        });

        fitPrompt();
      }

      function setPrompt(key) {
        if (!prompts[key]) return;
        state.prompt = key;
        history.replaceState(null, "", `${location.pathname}${location.search}#${key}`);
        renderPrompt(true);
      }

      async function copyAll() {
        const prompt = prompts[state.prompt];
        const fullText = prompt.pages.map((page) => page.text).join("\n\n");
        try {
          await navigator.clipboard.writeText(fullText);
        } catch {
          const area = document.createElement("textarea");
          area.value = fullText;
          area.style.position = "fixed";
          area.style.opacity = "0";
          document.body.appendChild(area);
          area.select();
          document.execCommand("copy");
          area.remove();
        }
        elements.toast.classList.add("show");
        setTimeout(() => elements.toast.classList.remove("show"), 1200);
      }

      document.querySelectorAll("[data-prompt]").forEach((button) => {
        button.addEventListener("click", () => setPrompt(button.dataset.prompt));
      });

      elements.select.addEventListener("change", () => {
        state.page = Number(elements.select.value);
        renderPrompt();
      });

      elements.previous.addEventListener("click", () => {
        state.page -= 1;
        renderPrompt();
      });

      elements.next.addEventListener("click", () => {
        state.page += 1;
        renderPrompt();
      });

      elements.copy.addEventListener("click", copyAll);
      addEventListener("resize", fitPrompt);
      addEventListener("hashchange", () => {
        state.prompt = promptFromLocation();
        renderPrompt(true);
      });

      state.prompt = promptFromLocation();
      renderPrompt(true);

      window.promptReader = {
        prompts,
        show(promptKey, pageIndex = 0) {
          if (!prompts[promptKey]) return;
          state.prompt = promptKey;
          state.page = pageIndex;
          renderPrompt();
        },
      };
    </script>
  </body>
</html>
